name: Windows 11 Layer A

on:
  pull_request:
  push:
    branches:
      - develop
  merge_group:

permissions:
  contents: read

env:
  CI_STAGE: full_activation
  UV_VERSION: '0.11.8'

jobs:
  windows_unit:
    name: layer-a / windows-unit
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Require full activation stage
        shell: pwsh
        run: |
          if ($env:CI_STAGE -ne 'full_activation') {
            throw "Expected ci_stage=full_activation, got ci_stage=$env:CI_STAGE"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'ci_stage=full_activation' -Encoding utf8

      - name: Install locked uv version
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "uv==$env:UV_VERSION"

      - name: Install locked project
        shell: pwsh
        run: uv sync --frozen

      - name: Verify Windows imports stay Quartz-free
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --frozen python -c "import sys; import obs_voice_command.os_zoom; import obs_voice_command.main; assert 'Quartz' not in sys.modules; print('Windows import smoke: PASS')"
          uv run --frozen obs-voice-command --help

      - name: Run hardware-free tests
        shell: pwsh
        run: uv run --frozen python -m pytest tests -q

  macos_regression:
    name: layer-a / macos-regression
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Require full activation stage
        shell: bash
        run: |
          if [[ "$CI_STAGE" != "full_activation" ]]; then
            echo "Expected ci_stage=full_activation, got ci_stage=$CI_STAGE" >&2
            exit 1
          fi
          printf '%s\n' 'ci_stage=full_activation' >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked uv version
        shell: bash
        run: python -m pip install --disable-pip-version-check "uv==$UV_VERSION"

      - name: Install locked project
        shell: bash
        run: uv sync --frozen

      - name: Verify macOS imports and CLI
        shell: bash
        run: |
          uv run --frozen python -c "import obs_voice_command.os_zoom; import obs_voice_command.main; print('macOS import smoke: PASS')"
          uv run --frozen obs-voice-command --help

      - name: Run macOS regression tests
        shell: bash
        run: uv run --frozen python -m pytest tests -q

  package:
    name: layer-a / package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Require full activation stage
        shell: bash
        run: |
          if [[ "$CI_STAGE" != "full_activation" ]]; then
            echo "Expected ci_stage=full_activation, got ci_stage=$CI_STAGE" >&2
            exit 1
          fi
          printf '%s\n' 'ci_stage=full_activation' >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked uv version
        shell: bash
        run: python -m pip install --disable-pip-version-check "uv==$UV_VERSION"

      - name: Install locked project
        shell: bash
        run: uv sync --frozen

      - name: Build wheel and source distribution
        shell: bash
        run: uv build

      - name: Verify the built wheel outside the checkout
        shell: bash
        run: |
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$wheel_path"
          test -n "$sdist_path"
          artifact_dir="$(mktemp -d)"
          artifact_env="$artifact_dir/venv"
          uv venv "$artifact_env"
          uv pip install --python "$artifact_env/bin/python" --no-deps "$wheel_path"
          cd "$artifact_dir"
          WHEEL_PATH="$wheel_path" "$artifact_env/bin/python" -c '
          import importlib.metadata
          import os
          from pathlib import Path

          import obs_voice_command
          import obs_voice_command.mouse
          import obs_voice_command.os_zoom
          import obs_voice_command.platform
          import obs_voice_command.platform.common
          import obs_voice_command.platform.unsupported
          import obs_voice_command.platform.windows

          wheel_path = Path(os.environ["WHEEL_PATH"]).resolve()
          distribution = importlib.metadata.distribution("obs-voice-command")
          module_path = Path(obs_voice_command.__file__).resolve()
          site_packages = Path(distribution.locate_file("")).resolve()

          assert wheel_path.suffix == ".whl"
          assert distribution.version in wheel_path.name
          assert module_path.is_relative_to(site_packages), (module_path, site_packages)
          assert Path(distribution.locate_file("obs_voice_command/os_zoom.py")).is_file()
          print(f"built artifact import: PASS (wheel={wheel_path.name})")
          '

  required_gate:
    name: required / gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [windows_unit, macos_regression, package]
    steps:
      - name: Require full activation and every Layer A job
        shell: bash
        env:
          WINDOWS_UNIT_RESULT: ${{ needs.windows_unit.result }}
          MACOS_REGRESSION_RESULT: ${{ needs.macos_regression.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          printf '%s\n' "ci_stage=$CI_STAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'windows_unit=%s\nmacos_regression=%s\npackage=%s\n' "$WINDOWS_UNIT_RESULT" "$MACOS_REGRESSION_RESULT" "$PACKAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CI_STAGE" != "full_activation" ]]; then
            echo "required / gate: FAIL (expected ci_stage=full_activation, got ci_stage=$CI_STAGE)" >&2
            exit 1
          fi
          if [[ "$WINDOWS_UNIT_RESULT" != "success" || "$MACOS_REGRESSION_RESULT" != "success" || "$PACKAGE_RESULT" != "success" ]]; then
            echo 'required / gate: FAIL (every required Layer A job must report success)' >&2
            exit 1
          fi
          echo 'required / gate: PASS (full activation and every required Layer A job succeeded)' >> "$GITHUB_STEP_SUMMARY"
