# Canonical tracker labels for the Windows 11 delivery workflow.
# Status values in issues and the manifest remain: Ready, Blocked, Doing, PR,
# Merged, Done. The status prefix keeps those labels distinct from ticket type.
- name: "status:ready"
  color: "0e8a16"
  description: "Ticket is eligible for a worker after dependencies and gates pass"
- name: "status:blocked"
  color: "b60205"
  description: "Ticket is blocked by a dependency, external gate, or failing evidence"
- name: "status:doing"
  color: "fbca04"
  description: "Worker has claimed the ticket and is implementing it"
- name: "status:pr"
  color: "1d76db"
  description: "Pull request is open and under review or CI"
- name: "status:merged"
  color: "5319e7"
  description: "GitHub merged the protected pull request; completion evidence is pending"
- name: "status:done"
  color: "006b75"
  description: "Manifest completion profile passed on the exact required SHA"
- name: "type:ticket"
  color: "c5def5"
  description: "Planned Windows 11 delivery ticket"
- name: "type:repair"
  color: "d93f0b"
  description: "Deduplicated repair ticket created by the repair workflow"
- name: "policy:merge-queue"
  color: "7057ff"
  description: "Work covered by the protected develop merge queue contract"
- name: "needs-human"
  color: "b60205"
  description: "Automation is stopped pending explicit human direction"
